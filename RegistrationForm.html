<html>
    <head>
        <title>Login</title> 
    </head>
    <body>
        <div>
            <label>Username</label>
            <input type="text" id="username">   
            <label id="lblerrorMessagename" style="color:red"></label>
            <br><br>
            <label>Mobile</label>
            <input type="text" id="mobile" >
            <label id="lblerrorMessagemobile" style="color:red"></label>    
            <br><br>
            <label>Gender </label>
            <input type="radio" id="male" name="gender" value="Male"> 
            <label for="male">Male</label>  
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>        
            <label id="lblerrorMessagegender" style="color:red"></label>
            <br><br>
            <label>Hobbies </label>
            <input type="checkbox" id="reading" name="hobbies" value="Reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="traveling" name="hobbies" value="Traveling">
            <label for="traveling">Traveling</label>
            <input type="checkbox" id="cooking" name="hobbies" value="Cooking">
            <label for="cooking">Cooking</label>  
            <input type="checkbox" id="sports" name="hobbies" value="Sports">
            <label for="sports">Sports</label>
             <input type="checkbox" id="music" name="hobbies" value="Music">
            <label for="music">Music</label>  
            <label id="lblerrorMessagehobbies" style="color:red"></label>
            <br><br>

            <button type="submit" id="loginButton">Create Account</button>
        </div>
    </body>
    <script>
            // write a button click event to get the value of username, mobile, gender and hobbies and print in console
            document.getElementById("loginButton").addEventListener("click", function() {
                var username = document.getElementById("username").value;
                var mobile = document.getElementById("mobile").value;
                var gender = document.querySelector('input[name="gender"]:checked');
                var hobbies = document.querySelectorAll('input[name="hobbies"]:checked').length;
                    if(username =="")        
                    {
                        document.getElementById("lblerrorMessagename").innerText = "Username is required";
                    }
                    else
                    {
                        document.getElementById("lblerrorMessagename").innerText = "";
                        console.log("Username: " + username);
                    }
                    if (mobile == "")
                    {
                        document.getElementById("lblerrorMessagemobile").innerText = "Mobile number is required";
                    }
                    else
                    {
                       console.log("Mobile: " + mobile);
                        document.getElementById("lblerrorMessagemobile").innerText = "";
                    }   
                    if (gender == null)
                    {
                        document.getElementById("lblerrorMessagegender").innerText = "  Gender is required";
                    }
                    else
                    {       
                        console.log("Gender: " + gender);       
                        document.getElementById("lblerrorMessagegender").innerText = "";                
                    }       
                    if (hobbies == 0)
                    {
                        document.getElementById("lblerrorMessagehobbies").innerText = "  At least one hobby is required";
                    }
                    else
                    {       
                        console.log("Hobbies: " + hobbies);       
                        document.getElementById("lblerrorMessagehobbies").innerText = "";                
                    }           



                // var hobbies = [];
                // var hobbyCheckboxes = document.querySelectorAll('input[name="hobbies"]:checked');
                // hobbyCheckboxes.forEach(function(checkbox) {
                //     hobbies.push(checkbox.value);
                // });
                // console.log("Username:", username);
                // console.log("Mobile:", mobile);
                // console.log("Gender:", gender);
                // console.log("Hobbies:", hobbies);
            });
    </script>
</html>
