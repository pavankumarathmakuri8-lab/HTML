<html>
    <head>
        <title>Login</title> 
    </head>
    <body>
        <div>
        <label>Username</label>
        <input type="text" id="username" name="username">
        <label id="lblerrorMessagename" style="color:red"></label>
        <br>
       <label>select your city</label>
       <select id="city" name="city">
            <option value="">--Select--</option>
            <option value="1">New York</option>
            <option value="2">Los Angeles</option>
            <option value="3">Chicago</option>
       </select>
       <label id="lblerrorMessagecity" style="color:red"></label>


        <button type="submit" id="loginButton">Login</button>   
       
        </div>
    </body>
    <script>
            // write a button click event to get the value of username and city and print in console
            document.getElementById("loginButton").addEventListener("click", function(){
                let username = document.getElementById("username").value;
                let city = document.getElementById("city").value;
                if(username =="")
                {
                    document.getElementById("lblerrorMessagename").innerText = "Username is required";
                }
                else
                {
                    document.getElementById("lblerrorMessagename").innerText = "";
                    console.log("Username: " + username);
                }
                if (city == "")
                {
                    document.getElementById("lblerrorMessagecity").innerText = "City is required";
                }
                else
                {
                   console.log("City: " + city);
                    document.getElementById("lblerrorMessagecity").innerText = "";
                }
               
            });
        </script>
</html>
