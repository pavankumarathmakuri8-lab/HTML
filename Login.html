<html>
    <head>
        <title>Login</title> 
        

    </head>
    <body>
        <div>
        <label>Username</label>
        <input type="text" id="username" name="username">
        <label id="lblerrorMessagename" style="color:red"></label>
        <br>
        <label for="password">Password</label>  
        <input type="password" id="password" name="password">
       <label id="lblerrorMesagepassword" style="color:red"></label>
        <br>
        <button type="submit" id="loginButton">Login</button>   
       
        </div> 


    </body>

    <script>
            // write a button click event to get the value of username and password and print in console
            document.getElementById("loginButton").addEventListener("click", function(){
                let username = document.getElementById("username").value;
                let password = document.getElementById("password").value;
                if(username =="")
                {
                    document.getElementById("lblerrorMessagename").innerText = "Username is required";
                }
                else
                {
                    document.getElementById("lblerrorMessagename").innerText = "";
                    console.log("Username: " + username);
                }
                if (password == "")
                {
                    document.getElementById("lblerrorMesagepassword").innerText = "Password is required";
                }
                else
                {
                   console.log("Password: " + password);
                    document.getElementById("lblerrorMesagepassword").innerText = "";
                }
               
            });
        </script>
</html>
